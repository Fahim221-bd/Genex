<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Genex Duty Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d3748;--mute:#6b8394;--blue:#eaf4fb;--blue2:#cfe5f4;--line:#d9e6ef;--mint:#cfeedd;--mint-d:#4fa77e;--red:#d9696b}
*{box-sizing:border-box}
body{margin:0;font-family:Poppins,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f3f9fd 0,#fff 380px) fixed;font-size:14px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;background:#fff;border-bottom:3px double var(--blue2)}
.brand{display:flex;align-items:center;gap:12px}.brand b{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:var(--mint);font:700 22px 'Cormorant Garamond',serif;color:#2f7a58}
.brand h1{font-size:26px}.brand small{display:block;color:var(--mute);font-size:11px}
.chip{display:flex;gap:10px;align-items:center;background:var(--blue);padding:6px 8px 6px 14px;border-radius:30px}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:9px 18px;background:var(--mint-d);color:#fff;font-weight:500}.btn.ghost{background:var(--blue);color:var(--ink)}.btn.sm{padding:5px 12px;font-size:12px}
main{max-width:1020px;margin:26px auto;padding:0 16px;display:grid;gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 6px 24px rgba(79,140,180,.08)}
.card>h2{font-size:26px;margin-bottom:4px}.sub{color:var(--mute);font-size:12px;margin-bottom:16px}
.auth{max-width:420px;margin:60px auto}.tabs{display:flex;background:var(--blue);border-radius:12px;padding:4px;margin:14px 0}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--mute)}.tabs .on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px #0001}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;color:var(--ink);background:#fbfdff}input:focus{outline:2px solid var(--blue2)}
.msg{color:var(--red);font-size:12px;min-height:18px;margin-top:8px}
.shifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sh{border:2px solid transparent;border-radius:16px;padding:14px 10px;text-align:center;font-weight:500;line-height:1.3;transition:.15s}
.sh span{display:block;font-size:24px;margin-bottom:4px}.sh:hover{transform:translateY(-2px)}
.sh.sel{border-color:var(--mint-d);box-shadow:0 0 0 4px #4fa77e26}.sh:disabled{opacity:.55;cursor:not-allowed}
.dates{display:flex;gap:16px;flex-wrap:wrap}.dates>div{flex:1;min-width:210px}
.console{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:20px;align-items:center}
.clock{background:linear-gradient(135deg,var(--blue),#f1fbf5);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:center}
.clock .t{font:700 54px 'Cormorant Garamond',serif;letter-spacing:2px}.clock small{color:var(--mute)}
.tgs{display:grid;gap:14px}.tgrow{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px}
.tg{width:58px;height:30px;border-radius:30px;background:#cdd9e2;position:relative;cursor:pointer;transition:.2s}
.tg i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0003;transition:.2s}
.tg.on{background:var(--mint-d)}.tg.on i{left:31px}
.rep{margin-top:18px;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rep>h3{padding:12px 16px;background:var(--blue);font-size:21px;display:flex;justify-content:space-between;align-items:center}
.rep h3 small{font:400 11px Poppins;color:var(--mute)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:500;background:#fafdff}
.sal{background:var(--mint);padding:3px 10px;border-radius:20px;font-weight:600}
.brk{background:#ffe3b8;padding:3px 10px;border-radius:20px;font-weight:600}
.tot{background:var(--blue2);padding:3px 10px;border-radius:20px;font-weight:600}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sum div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center}
.sum small{display:block;color:var(--mute);font-size:11px}.sum b{font:700 22px 'Cormorant Garamond',serif}
.sum .s{background:var(--mint)}.sum .b{background:#ffe3b8}.sum .t{background:var(--blue2)}
.ed{border:0;background:var(--blue);border-radius:8px;width:30px;height:28px}
.more{display:block;margin:12px auto}.run{color:var(--mint-d);font-weight:600}
.pbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.pbar div{width:170px}
.act{list-style:none;padding:0;margin:0}.act li{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.act li:before{content:"";width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--mint-d);box-shadow:0 0 0 4px var(--mint);flex:none}
.act small{color:var(--mute);display:block}
#modal{position:fixed;inset:0;background:#1d37484d;display:none;place-items:center;z-index:9;padding:16px}
#modal.show{display:grid}.box{background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%}.box h3{font-size:26px;margin-bottom:8px}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:12px;transition:.3s;z-index:10}
#toast.show{transform:translateX(-50%)}
#pa{display:none}
@media(max-width:700px){.console{grid-template-columns:1fr}.clock .t{font-size:42px}header{padding:12px 16px}}
@media print{@page{size:A4;margin:12mm}body>*:not(#pa){display:none!important}#pa{display:block;color:#000}#pa h2{font-size:22px}#pa table{min-width:0;font-size:10.5px;margin-bottom:16px}#pa h3{margin:14px 0 6px;font-size:16px}}
</style></head>
<body>
<header><div class="brand"><b>G</b><div><h1>Genex Duty Tracker</h1><small>Shift hours, counted to the second · saved on this device</small></div></div><div id="hu"></div></header>
<main id="app"></main>
<div id="modal"><div class="box" id="mbox"></div></div><div id="toast"></div><div id="pa"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,get,push,update,onValue} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyCEnSE_jPPgTRzbrOQlROSXCN2soAToEiE",
  authDomain: "genex-dc660.firebaseapp.com",
  databaseURL: "https://genex-dc660-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "genex-dc660",
  storageBucket: "genex-dc660.firebasestorage.app",
  messagingSenderId: "36849681934",
  appId: "1:36849681934:web:bf5fcf8a779602a83f9e5f"
};
const db=getDatabase(initializeApp(firebaseConfig));

const SHIFTS=[
 {id:"8-17",l:"8 AM – 5 PM",c:"#fff2b3",i:"🌅"},{id:"9-18",l:"9 AM – 6 PM",c:"#ffe3b8",i:"☀️"},
 {id:"10-19",l:"10 AM – 7 PM",c:"#cfe9fb",i:"🌤️"},{id:"11-20",l:"11 AM – 8 PM",c:"#c9f0ea",i:"🌞"},
 {id:"14-23",l:"2 PM – 11 PM",c:"#ddd3f6",i:"🌇"},{id:"23-8",l:"11 PM – 8 AM",c:"#b9c6ee",i:"🌙",night:1}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2=n=>String(n).padStart(2,"0"),ymd=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
const dur=s=>{s=Math.max(0,Math.floor(s));return `${p2(Math.floor(s/3600))}:${p2(Math.floor(s%3600/60))}:${p2(s%60)}`};
const fd=s=>new Date(s+"T00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
const ft=t=>new Date(t).toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const loc=t=>{const d=new Date(t);return `${ymd(d)}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`};
const next=s=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+1);return ymd(d)};
const dateFor=(s,t)=>!s.night?s.d1:(ymd(new Date(t))<=s.d1?s.d1:s.d2);
const dt=(s,t)=>`${fd(dateFor(s,t))} · ${ft(t)}`;

let me=localStorage.getItem("gx"),users={},sess={},acts={},sel=null,d1="",d2="",active=null,shown={},allActs=false,mode="reg";
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600)};
const modal=h=>{$("#mbox").innerHTML=h;$("#modal").classList.add("show")},closeM=()=>$("#modal").classList.remove("show");
const log=(text)=>push(ref(db,"activity"),{ts:Date.now(),gid:me,name:users[me]?.name||me,text});
const clean=s=>s.trim().replace(/[.#$\[\]\/]/g,"-");

let usersLoaded=false;
const dbErr=e=>{usersLoaded=true;if(me&&!users[me]){me=null}draw();toast(/permission/i.test(e.message)?"Database blocked: set Realtime Database rules to allow read/write":"Database error: "+e.message)};
if(me)$("#app").innerHTML=`<section class="card auth"><h2>Loading…</h2><div class="sub">Connecting to the database.</div></section>`;else drawAuth();
setTimeout(()=>{if(!usersLoaded){usersLoaded=true;draw()}},4000);
onValue(ref(db,"users"),s=>{users=s.val()||{};usersLoaded=true;draw()},dbErr);
onValue(ref(db,"sessions"),s=>{sess=s.val()||{};active=null;for(const[k,v]of Object.entries(sess))if(v.gid===me&&v.status==="on")active={k,...v};draw()},dbErr);
onValue(ref(db,"activity"),s=>{acts=s.val()||{};if(me&&users[me])drawAct()},()=>{});

function draw(){
  if(!me||!users[me]){if(me&&!usersLoaded)return;if(!$("#gid"))drawAuth();return}
  $("#hu").innerHTML=`<div class="chip"><span>${esc(users[me].name)} · ${esc(me)}</span><button class="btn ghost sm" data-a="out">Log out</button></div>`;
  if(!$("#console")){$("#app").innerHTML=`<section class="card" id="console"></section><section class="card" id="rp"></section><section class="card" id="ac"></section>`}
  if(active){sel=SHIFTS.find(x=>x.id===active.shift);d1=active.d1;d2=active.d2||""}
  drawConsole();drawRep();drawAct();
}
function drawAuth(){
  $("#hu").innerHTML="";
  $("#app").innerHTML=`<section class="card auth"><h2>Welcome</h2><div class="sub">Register once, then log in with your Genex ID only.</div>
  <div class="tabs"><button data-a="tab" data-m="reg" class="${mode=="reg"?"on":""}">Register</button><button data-a="tab" data-m="log" class="${mode=="log"?"on":""}">Log in</button></div>
  ${mode=="reg"?`<label>Name</label><input id="nm" placeholder="Your full name">`:""}
  <label>Genex ID</label><input id="gid" placeholder="e.g. GX1024"><div class="msg" id="am"></div>
  <button class="btn" style="width:100%;margin-top:6px" data-a="${mode=="reg"?"reg":"login"}">${mode=="reg"?"Create my slot":"Log in"}</button></section>`;
}
function drawConsole(){
  const night=sel?.night,on=!!active;
  $("#console").innerHTML=`<h2>Duty console</h2><div class="sub">Pick a shift and date, then switch on when your duty starts.</div>
  <div class="shifts">${SHIFTS.map(s=>`<button class="sh ${sel?.id==s.id?"sel":""}" style="background:${s.c}" data-a="shift" data-id="${s.id}" ${on?"disabled":""}><span>${s.i}</span>${s.l}</button>`).join("")}</div>
  <div class="dates" style="margin-top:6px"><div><label>${night?"Date for 11 PM – 11:59 PM":"Duty date"}</label><input type="date" id="d1" value="${d1}" ${on?"disabled":""}></div>
  ${night?`<div><label>Date for 12 AM – 8 AM (next day)</label><input type="date" id="d2" value="${d2}" ${on?"disabled":""}></div>`:""}</div>
  <div class="console"><div class="clock"><div class="t" id="clk">00:00:00</div><small id="cs">${on?esc(active.label):"Shift is off"}</small></div>
  <div class="tgs"><div class="tgrow"><div><b>On shift</b><br><small style="color:var(--mute)">Starts the live counter</small></div><div class="tg ${on?"on":""}" data-a="on"><i></i></div></div>
  <div class="tgrow"><div><b>Off shift</b><br><small style="color:var(--mute)">Closes the day and saves it</small></div><div class="tg" data-a="off"><i></i></div></div></div></div>`;
  tick();
}
const tick=()=>{const c=$("#clk");if(c&&active)c.textContent=dur((Date.now()-active.loginTs)/1000)};setInterval(tick,1000);

const salary=s=>s.totalSec!=null?s.totalSec:s.rawSec;
const KPI=8*3600;
const calc=s=>{const w=salary(s),k=Math.min(w,KPI),b=Math.max(0,w-KPI);return{k,b,t:k+b}};
const sumBox=l=>{const c=l.filter(s=>s.rawSec!=null).map(calc),k=c.reduce((x,y)=>x+y.k,0),b=c.reduce((x,y)=>x+y.b,0);
 return `<div class="sum"><div class="s"><small>Salary hours (KPI 8h/day)</small><b>${dur(k)}</b></div><div class="b"><small>Break hours</small><b>${dur(b)}</b></div><div class="t"><small>Total hours (Salary + Break)</small><b>${dur(k+b)}</b></div></div>`};
function rows(list){return list.map(s=>`<tr><td>${esc(fd(s.d1))}</td><td>${esc(s.label)}</td><td>${dt(s,s.loginTs)}</td>
 <td>${s.logoutTs?dt(s,s.logoutTs):`<span class="run">Running</span>`}</td><td>${s.rawSec!=null?dur(s.rawSec):"—"}</td>
 <td>${s.totalSec!=null?dur(s.totalSec)+" ":""}${s.logoutTs?`<button class="ed" title="Edit" data-a="edit" data-k="${s.k}">✎</button>`:""}</td>
 <td>${s.rawSec!=null?`<span class="sal">${dur(calc(s).k)}</span>`:"—"}</td><td>${s.rawSec!=null?`<span class="brk">${dur(calc(s).b)}</span>`:"—"}</td><td>${s.rawSec!=null?`<span class="tot">${dur(calc(s).t)}</span>`:"—"}</td></tr>`).join("")}
const head=`<thead><tr><th>Date</th><th>Shift</th><th>Login time</th><th>Logout time</th><th>Raw</th><th>Adjusted</th><th>Salary hours (KPI)</th><th>Break hours</th><th>Total hours</th></tr></thead>`;
const byUser=g=>Object.entries(sess).filter(([,v])=>v.gid===g).map(([k,v])=>({k,...v})).sort((a,b)=>b.loginTs-a.loginTs);
function drawRep(){
  const ids=[me,...Object.keys(users).filter(u=>u!==me)];
  $("#rp").innerHTML=`<h2>User reports</h2><div class="sub">Latest 10 duty days per user. Older days stay hidden until you ask, and print always includes everything.</div>
  <div class="pbar"><div><label>Print from</label><input type="date" id="pf"></div><div><label>Print to</label><input type="date" id="pt"></div><button class="btn" data-a="print">Print A4</button></div>
  ${ids.map(g=>{const all=byUser(g),days=[...new Set(all.map(s=>s.d1))].sort().reverse(),n=shown[g]||10,vis=new Set(days.slice(0,n)),list=all.filter(s=>vis.has(s.d1));
   return `<div class="rep"><h3>${esc(users[g].name)} <small>${esc(g)} · ${days.length} duty days</small></h3>
   ${all.length?sumBox(all):""}
   ${list.length?`<div class="wrap"><table>${head}<tbody>${rows(list)}</tbody></table></div>`:`<p style="padding:16px;color:var(--mute)">No duty recorded yet.</p>`}
   ${days.length>n?`<button class="btn ghost sm more" data-a="more" data-g="${esc(g)}">Show more (${Math.min(20,days.length-n)} days)</button>`:""}</div>`}).join("")}`;
}
function drawAct(){
  if(!$("#ac"))return;
  const l=Object.values(acts).sort((a,b)=>b.ts-a.ts),v=allActs?l:l.slice(0,10);
  $("#ac").innerHTML=`<h2>Activity flow</h2><div class="sub">Everything that changed, newest first.</div>
  <ul class="act">${v.map(a=>`<li><div>${esc(a.name)} (${esc(a.gid)}) ${esc(a.text)}<small>${new Date(a.ts).toLocaleString("en-GB")}</small></div></li>`).join("")||"<li>No activity yet.</li>"}</ul>
  ${!allActs&&l.length>10?`<button class="btn ghost sm more" data-a="older">Load older data</button>`:""}`;
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;
  try{
  if(a=="tab"){mode=t.dataset.m;drawAuth()}
  if(a=="reg"){const n=$("#nm").value.trim(),g=clean($("#gid").value);if(!n||!g)return $("#am").textContent="Enter your name and Genex ID.";
    if((await get(ref(db,"users/"+g))).exists())return $("#am").textContent="This Genex ID is already registered. Use Log in.";
    await set(ref(db,"users/"+g),{name:n,at:Date.now()});me=g;localStorage.setItem("gx",g);await log("registered");toast("Registered. Welcome!")}
  if(a=="login"){const g=clean($("#gid").value);if(!g)return $("#am").textContent="Enter your Genex ID.";
    if(!(await get(ref(db,"users/"+g))).exists())return $("#am").textContent="Genex ID not found. Please register first.";
    me=g;localStorage.setItem("gx",g);users[g]={name:(await get(ref(db,"users/"+g+"/name"))).val()};await log("logged in");draw()}
  if(a=="out"){localStorage.removeItem("gx");me=null;sel=null;d1=d2="";$("#console")&&($("#app").innerHTML="");mode="log";drawAuth()}
  if(a=="shift"){sel=SHIFTS.find(x=>x.id==t.dataset.id);if(d1&&sel.night&&!d2)d2=next(d1);drawConsole()}
  if(a=="on"){if(active)return;if(!sel||!d1||(sel.night&&!d2))return toast("Select the Date & Shift first");
    const rec={gid:me,shift:sel.id,label:sel.l,night:!!sel.night,d1,d2:sel.night?d2:null,loginTs:Date.now(),status:"on"};
    await push(ref(db,"sessions"),rec);await log(`started ${sel.l} on ${fd(d1)}`)}
  if(a=="off"){if(!active)return toast("Turn on shift first");
    modal(`<h3>Day close</h3><p>Close ${esc(fd(active.d1))} (${esc(active.label)}) and save this duty?</p><div class="btns"><button class="btn ghost" data-a="no">No</button><button class="btn" data-a="yes">Yes, close day</button></div>`)}
  if(a=="no")closeM();
  if(a=="yes"){const o=active,now=Date.now();closeM();sel=null;d1=d2="";
    await update(ref(db,"sessions/"+o.k),{logoutTs:now,rawSec:Math.floor((now-o.loginTs)/1000),status:"closed"});
    await log(`closed day ${fd(o.d1)} (${o.label}) · ${dur((now-o.loginTs)/1000)}`);toast("Day closed and saved")}
  if(a=="more"){shown[t.dataset.g]=(shown[t.dataset.g]||10)+20;drawRep()}
  if(a=="older"){allActs=true;drawAct()}
  if(a=="edit"){const s=sess[t.dataset.k];modal(`<h3>Adjust hours</h3><label>Login time</label><input type="datetime-local" step="1" id="el" value="${loc(s.loginTs)}">
    <label>Logout time</label><input type="datetime-local" step="1" id="eo" value="${loc(s.logoutTs)}"><div class="msg" id="em"></div>
    <div class="btns"><button class="btn ghost" data-a="no">Cancel</button><button class="btn ghost" data-a="stot" data-k="${t.dataset.k}">Save total hours</button><button class="btn" data-a="sraw" data-k="${t.dataset.k}">Submit raw</button></div>`)}
  if(a=="stot"||a=="sraw"){const l=new Date($("#el").value).getTime(),o=new Date($("#eo").value).getTime();
    if(!(o>l))return $("#em").textContent="Logout must be after login.";const k=t.dataset.k,s=sess[k],sec=Math.floor((o-l)/1000);
    if(a=="stot"){await update(ref(db,"sessions/"+k),{totalSec:sec});await log(`set total hours ${dur(sec)} for ${fd(s.d1)}`)}
    else{await update(ref(db,"sessions/"+k),{loginTs:l,logoutTs:o,rawSec:sec,totalSec:null});await log(`submitted raw ${dur(sec)} for ${fd(s.d1)}`)}
    closeM();toast("Saved")}
  if(a=="print"){const f=$("#pf").value,to=$("#pt").value;if(!f||!to)return toast("Select the print date range");
    $("#pa").innerHTML=`<h2>Genex Duty Report</h2><p>${fd(f)} to ${fd(to)}</p>`+Object.keys(users).map(g=>{
      const l=byUser(g).filter(s=>s.d1>=f&&s.d1<=to).reverse();if(!l.length)return"";
      return `<h3>${esc(users[g].name)} (${esc(g)})</h3>${sumBox(l)}<table>${head}<tbody>${rows(l).replace(/<button.*?<\/button>/g,"")}</tbody></table>`}).join("")||"<p>No data in this range.</p>";
    window.print()}
  }catch(err){const m=/permission/i.test(err.message)?"Database blocked: set Realtime Database rules to allow read/write":"Error: "+err.message;$("#am")?$("#am").textContent=m:toast(m)}
});
document.addEventListener("change",e=>{
  if(e.target.id=="d1"){d1=e.target.value;if(sel?.night)d2=d1?next(d1):"";drawConsole()}
  if(e.target.id=="d2")d2=e.target.value;
});
</script></body></html>
